repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (staged files)
        entry: bash -c 'docker run --rm -v "$(pwd)":/repo -w /repo zricethezav/gitleaks:v8.28.0 git --pre-commit --staged --config=.gitleaks.toml --redact'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: gitleaks-ci
        name: Detect hardcoded secrets (repository scan for CI)
        entry: bash -c 'docker run --rm -v "$(pwd)":/repo -w /repo zricethezav/gitleaks:v8.28.0 detect --source=. --config=.gitleaks.toml --redact'
        language: system
        pass_filenames: false
        stages: [manual]
